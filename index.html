<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- App Bridge must load first; the api key is the app's public client id. -->
  <meta name="shopify-api-key" content="bb93b709eabcc01ea192be3cc5ab86ae">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>مدير العروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f2; --card: #fff; --text: #1a1d1b; --muted: #6b716d; --line: #e3e6e2;
      --primary: #0f4d36; --primary-soft: #e6f1ec; --danger: #b42318; --danger-soft: #fdecea;
      --warn: #a15c07; --warn-soft: #fff4e0; --info-soft: #eef2ff; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", Tahoma, system-ui, sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs { display: flex; gap: 4px; background: #e9ebe7; padding: 4px; border-radius: 10px; overflow-x: auto; }
    .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--muted); }
    .tab[aria-selected="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

    .btn { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .btn:hover { background: #f7f8f6; }
    .btn--primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn--primary:hover { background: #0b3d2a; }
    .btn--danger { color: var(--danger); }
    .btn--sm { padding: 4px 10px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .icon-btn { border: 1px solid var(--line); background: #fff; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; line-height: 1; }

    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: start; }
    .stat b { display: block; font-size: 22px; }
    .stat[aria-pressed="true"] { outline: 2px solid var(--primary); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
    .toolbar .grow { flex: 1 1 220px; }
    .input, select.input { width: 100%; border: 1px solid #cfd4cf; border-radius: 8px; padding: 7px 10px; background: #fff; }
    .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

    .bulk { display: none; gap: 8px; align-items: center; padding: 10px 12px; background: var(--primary-soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .bulk.is-on { display: flex; }

    .row { display: grid; grid-template-columns: 28px 44px 56px minmax(160px, 2fr) 130px minmax(140px, 1.4fr) 120px 150px; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row--head { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbf9; border-radius: var(--radius) var(--radius) 0 0; }
    .row.is-off { background: #fbfbfa; }
    .row.is-off .thumb, .row.is-off .name { opacity: .55; }
    .rank { font-weight: 700; color: var(--muted); text-align: center; }
    .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #eee; display: block; }
    .name b { display: block; }
    .prio { display: flex; gap: 4px; align-items: center; }
    .prio input { width: 64px; text-align: center; padding: 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 11px; background: #f0f1ee; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
    .badge--ok { background: var(--primary-soft); color: var(--primary); }
    .badge--out { background: var(--danger-soft); color: var(--danger); }
    .badge--hidden { background: var(--warn-soft); color: var(--warn); }
    .badge--draft { background: var(--info-soft); color: #3730a3; }
    .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: #c9cec9; border-radius: 99px; cursor: pointer; transition: .15s; }
    .switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + span { background: var(--primary); }
    .switch input:checked + span::after { inset-inline-start: 19px; }
    .switch input:disabled + span { opacity: .5; cursor: default; }
    .stock-cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .field label { font-weight: 600; font-size: 13px; }
    .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .checks label { display: flex; gap: 6px; align-items: center; font-weight: 400; cursor: pointer; }
    .note { background: var(--info-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .note--warn { background: var(--warn-soft); }

    dialog { border: 0; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
    .dlg-body { padding: 16px; }
    .dlg-foot { display: flex; justify-content: flex-start; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; }
    .offer-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .offer-media figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
    .offer-media img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #eee; }
    .offer-media figure div { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    textarea.input { resize: vertical; }
    .vtable { width: 100%; border-collapse: collapse; }
    .vtable td, .vtable th { padding: 6px 4px; text-align: start; border-bottom: 1px solid var(--line); }
    .vtable input { width: 90px; }

    .cat-list .row, .offer-list .row { grid-template-columns: minmax(160px, 1.5fr) 100px minmax(200px, 2fr) 140px; }
    .preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 12px; }
    .preview figure { margin: 0; text-align: center; font-size: 11px; }
    .preview img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #eee; }
    .preview figcaption b { color: var(--primary); }

    .toast { position: fixed; bottom: 18px; inset-inline-start: 50%; transform: translateX(50%); background: #1a1d1b; color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; }
    .toast.is-on { opacity: 1; }
    .toast.is-err { background: var(--danger); }
    .loading { padding: 60px; text-align: center; color: var(--muted); }
    .demo-bar { background: var(--warn-soft); color: var(--warn); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

    .order { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .order:last-child { border-bottom: 0; }
    .order.is-cancelled { background: var(--danger-soft); border-inline-start: 4px solid var(--danger); }
    .order.is-cancelled .order__items { background: #fff6f5; }
    .order__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .order__items { white-space: pre-line; font-size: 13px; background: #fafbf9; border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
    .order__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .code { direction: ltr; text-align: left; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; overflow: auto; max-height: 220px; }
    .steps { margin: 0 0 12px; padding-inline-start: 20px; font-size: 13px; }
    .steps li { margin-bottom: 4px; }

    /* Phones: each perfume becomes a compact card */
    @media (max-width: 860px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .row--head { display: none; }
      .row { grid-template-columns: 24px 48px 1fr; grid-template-areas: "sel thumb name" "rank rank rank" "prio prio prio" "cats cats cats" "stock stock stock" "act act act"; row-gap: 8px; }
      .row > .c-sel { grid-area: sel; } .row > .c-thumb { grid-area: thumb; } .row > .c-name { grid-area: name; }
      .row > .c-rank { display: none; }
      .row > .c-prio { grid-area: prio; } .row > .c-cats { grid-area: cats; } .row > .c-stock { grid-area: stock; } .row > .c-act { grid-area: act; }
      .stock-cell { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .actions { justify-content: flex-start; }
      .c-prio::before { content: "الأولوية:"; font-size: 12px; color: var(--muted); margin-inline-end: 6px; }
      .cat-list .row, .offer-list .row { grid-template-columns: 1fr; grid-template-areas: none; }
      .grid2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .stats { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 2px; scrollbar-width: none; }
      .stat { flex: 0 0 auto; min-width: 104px; padding: 8px 12px; }
      .stat b { font-size: 18px; }
      .toolbar .grow { flex-basis: 100%; }
    }
    @media (max-width: 480px) { .wrap { padding: 10px; } h1 { font-size: 18px; } }

    /* ============ Visual refresh: brand colours, the site's font, softer cards ============ */
    :root {
      --bg: #f5f3ee; --text: #18211c; --muted: #6c7570; --line: #ebe7de;
      --primary: #0f4d36; --primary-2: #17704f; --primary-soft: #e8f3ed; --gold: #b8862b; --gold-soft: #fbf3e0;
      --radius: 16px; --shadow: 0 1px 2px rgba(20, 30, 24, .05), 0 8px 24px rgba(20, 30, 24, .06);
    }
    body { font-family: "Alexandria", "Segoe UI", Tahoma, system-ui, sans-serif; background: radial-gradient(1200px 500px at 100% -10%, #e6f2ea 0%, transparent 60%), var(--bg); }
    .wrap { padding: 20px; }
    .top { display: block; margin-bottom: 18px; }
    .hero { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 22px 22px 36px; border-radius: 20px; color: #fff;
      background: linear-gradient(135deg, #0f4d36 0%, #17704f 60%, #1f8a62 100%); box-shadow: 0 12px 30px rgba(15, 77, 54, .25); }
    .hero::after { content: ""; position: absolute; inset-inline-end: -70px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(232, 196, 106, .38), transparent 70%); }
    .hero__logo { width: 50px; height: 50px; border-radius: 14px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .22); display: grid; place-items: center; flex: none; }
    .hero__logo svg { width: 26px; height: 26px; }
    .hero h1 { font-size: 22px; font-weight: 800; }
    .hero p { margin: 3px 0 0; color: rgba(255, 255, 255, .82); font-size: 13px; }
    .tabs { position: relative; z-index: 1; margin: -20px 14px 0; background: #fff; padding: 6px; border-radius: 14px; box-shadow: var(--shadow); gap: 4px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 10px; font-weight: 700; color: var(--muted); transition: background .15s, color .15s; }
    .tab svg { width: 16px; height: 16px; flex: none; }
    .tab:hover { background: #f4f2ec; color: var(--text); }
    .tab[aria-selected="true"] { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(15, 77, 54, .25); }
    .card { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .stats { gap: 12px; margin-bottom: 16px; }
    .stat { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 14px; box-shadow: var(--shadow); font-weight: 600; color: var(--muted);
      transition: transform .15s, border-color .15s, background .15s; }
    .stat b { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.15; }
    .stat:hover { transform: translateY(-2px); }
    .stat::before { content: ""; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--line); }
    .stat[aria-pressed="true"] { outline: 0; border-color: var(--primary); background: linear-gradient(180deg, #fff, var(--primary-soft)); }
    .stat[aria-pressed="true"] b { color: var(--primary); }
    .stat[aria-pressed="true"]::before { background: var(--primary); }
    .btn { border-radius: 10px; padding: 8px 15px; font-weight: 700; transition: transform .1s, box-shadow .15s, background .15s; }
    .btn:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .07); }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; box-shadow: 0 4px 12px rgba(15, 77, 54, .22); }
    .btn--primary:hover { background: linear-gradient(135deg, #0b3d2a, var(--primary)); }
    .btn--sm { padding: 6px 12px; }
    .icon-btn { border-radius: 10px; }
    .input, select.input { border-radius: 10px; border-color: #ddd8cc; padding: 8px 11px; transition: border-color .15s, box-shadow .15s; }
    .input:focus { outline: 0; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 77, 54, .12); }
    .toolbar { padding: 14px; background: #fcfbf8; }
    .row { padding: 11px 14px; transition: background .12s; }
    .row:not(.row--head):hover { background: #faf9f5; }
    .row--head { background: #f8f6f0; }
    .thumb { border-radius: 10px; }
    .badge { font-weight: 700; padding: 3px 10px; }
    .badge--hidden { background: var(--gold-soft); color: #8a5a06; }
    .note { background: #f1f6ff; border: 1px solid #dfe8fb; border-radius: 12px; }
    .note--warn { background: var(--gold-soft); border-color: #f0dfb3; }
    dialog { border-radius: 20px; }
    .dlg-head h2 { font-size: 17px; }
    .order { padding: 16px; gap: 6px; transition: background .12s; }
    .order:hover { background: #fcfbf8; }
    .order__head > b:first-child { font-size: 16px; }
    .order__items { background: #f8f6f0; border: 1px solid #efebe1; border-radius: 12px; padding: 10px 12px; line-height: 1.85; }
    .order__foot > b { font-size: 17px; color: var(--primary); }
    .order.is-cancelled:hover { background: var(--danger-soft); }
    .order.is-open { background: #fcfbf8; }

    /* Perfumes table, the old site's catalogue layout */
    .ptable { overflow-x: auto; }
    .prow { display: grid; grid-template-columns: 26px 128px 56px minmax(170px, 1.6fr) 58px 58px 64px 92px 64px 64px 84px 118px 70px;
      gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 1120px; transition: background .12s; }
    .prow:last-child { border-bottom: 0; }
    .prow:not(.prow--head):hover { background: #faf9f5; }
    .prow--head { background: #f8f6f0; font-size: 12px; font-weight: 800; color: var(--primary); }
    .prow--head small { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
    .prow.is-off .thumb, .prow.is-off .name { opacity: .55; }
    .prow .thumb { width: 46px; height: 46px; border-radius: 50%; }
    .prow .name b { font-size: 15px; }
    .prow .name .small { color: #44504a; }
    .pslug { display: block; font: 10px ui-monospace, Consolas, monospace; color: var(--muted); direction: ltr; text-align: end; }
    .pnum { font-weight: 800; font-size: 15px; text-align: center; }
    .pnum--old { color: var(--muted); text-decoration: line-through; font-weight: 600; }
    .pgrade { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 10px; padding: 4px 8px; background: #f1eee6; color: var(--muted); text-align: center; }
    .pgrade.is-top { background: var(--primary); color: #fff; }
    .pgrade.is-both { background: #db2777; color: #fff; }
    .pup { display: inline-block; min-width: 44px; text-align: center; border: 1.5px solid #f2a6c4; color: #9d174d; border-radius: 999px; padding: 2px 8px; font-weight: 800; }
    .pstock { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; font-weight: 700; color: #15803d; background: #ecfdf3; border: 1px solid #b7ebc9; border-radius: 999px; padding: 3px 10px; }
    .pstock.is-out { color: #b42318; background: #fef0ef; border-color: #f6c4bf; }
    .pstock input { display: none; }
    .pvis { display: inline-block; font-size: 11px; font-weight: 700; color: #15803d; background: #ecfdf3; border: 1px solid #b7ebc9; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .pvis.is-hidden { color: #b42318; background: #fef0ef; border-color: #f6c4bf; }
    .pvis.is-draft { color: #8a5a06; background: var(--gold-soft); border-color: #f0dfb3; }
    @media (max-width: 860px) {
      .prow--head { display: none; }
      /* Phones: a card per perfume; name line, then the numbers and badges wrap underneath */
      .prow { min-width: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; }
      .prow > .c-name { flex: 1 1 0; min-width: 140px; }
      .prow > .c-prio { order: 10; flex-basis: 100%; }
      .prow > .c-u110, .prow > .c-u50 { font-size: 12px; }
      .prow [data-label]::before { content: attr(data-label) ": "; font-size: 11px; color: var(--muted); font-weight: 500; }
      .pnum { text-align: start; font-size: 14px; }
    }

    /* Order details, laid out like the old site's admin: quick copies, recipient, perfumes */
    .odet { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
    .odet__quick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
    .odet__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; align-items: start; }
    .odet__box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .odet__h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; }
    .odet__copy { padding: 4px 10px; font-size: 12px; background: var(--primary-soft); border-color: transparent; color: var(--primary); white-space: nowrap; }
    .odet__copy:hover { background: var(--primary); color: #fff; }
    .odet__field { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f8f6f0; border: 1px solid #efebe1; border-radius: 12px; padding: 9px 11px; }
    .odet__field small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .odet__field b { font-size: 15px; }
    .odet__field--addr { align-items: flex-start; line-height: 1.9; font-size: 13px; }
    .odet__field--addr b { font-size: 13px; }
    .odet__pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .odet__note { background: var(--gold-soft); border: 1px solid #f0dfb3; border-radius: 12px; padding: 9px 11px; font-size: 13px; white-space: pre-line; }
    .odet__note small { display: block; font-weight: 700; color: #8a5a06; margin-bottom: 2px; }
    .odet__item { border: 1px solid #f0dfb3; background: #fffdf7; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .odet__item-h { display: flex; align-items: center; gap: 10px; }
    .odet__item-h img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: #eee; }
    .odet__badge { display: inline-block; background: #d97706; color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-inline-end: 6px; }
    .odet__price { color: var(--primary); white-space: nowrap; }
    .odet__picks { display: flex; flex-direction: column; gap: 6px; }
    .odet__picks-h { font-size: 12px; font-weight: 700; color: #92400e; }
    .odet__pick { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #f3e8cc; border-radius: 10px; padding: 7px 9px; }
    .odet__pick img, .odet__noimg { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex: none; background: #f1eee6; }
    .odet__pick b { font-size: 13px; }
    .odet__n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #b45309; color: #fff; font-size: 11px; font-weight: 800; }
    .odet__tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .odet__tags span { font-size: 11px; border-radius: 999px; padding: 0 7px; background: #f1eee6; color: var(--muted); font-weight: 700; }
    .odet__tags .is-top { background: var(--primary-soft); color: var(--primary); }
    .odet__tags .is-extra { background: var(--gold-soft); color: #8a5a06; }
    .odet__tags .is-gift { background: #fde8e8; color: #b42318; }
    .odet__sum { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .odet__sum div { display: flex; justify-content: space-between; }
    .odet__sum .is-total { font-size: 15px; font-weight: 800; color: var(--primary); }
    .odet__ship { border-color: #fbd5b5; background: #fffaf5; }
    /* «السلال» tab */
    .vis-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow); }
    .vis-stats > div { background: #fff; padding: 12px 14px; }
    .vis-stats small { color: var(--muted); font-size: 12px; font-weight: 600; display: block; }
    .vis-stats b { font-size: 22px; font-weight: 800; color: var(--primary); }
    .vis-bar { padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .vis-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .vis-chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .vis-chip[aria-pressed="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
    .vis-search { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; }
    .vis-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
    .vis-side { display: flex; flex-direction: column; gap: 10px; }
    .vis-src { display: grid; grid-template-columns: repeat(6, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .vis-src > div { padding: 8px 6px; text-align: center; }
    .vis-src > div + div { border-inline-start: 1px solid var(--line); }
    .vis-src small { display: block; font-size: 11px; color: var(--muted); }
    .vis-src b { font-size: 14px; color: var(--primary); }
    .vis-empty { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--gold-soft); border: 1px solid #f0dfb3; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .vis-list { display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow: auto; padding: 2px; }
    .vis-row { text-align: start; font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .vis-row:hover { border-color: #bcd6c6; }
    .vis-row.is-sel { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); background: #f6fbf8; }
    .vis-row__top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .vis-row__top code { font-size: 11px; background: var(--gold-soft); border-radius: 6px; padding: 1px 6px; }
    .vis-chip-sm { font-size: 11px; border: 1px solid #bfe3cc; color: #15803d; border-radius: 999px; padding: 0 7px; }
    .vis-row__mid { display: flex; align-items: baseline; gap: 6px; }
    .vis-row__val { margin-inline-start: auto; color: var(--primary); }
    .vis-detail { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 10px; }
    .vis-pick { text-align: center; padding: 60px 10px; font-size: 40px; color: var(--muted); }
    .vis-pick p { font-size: 15px; font-weight: 700; color: var(--text); }
    .vis-d__head { display: flex; align-items: center; gap: 10px; }
    .vis-d__head > div { flex: 1; min-width: 0; }
    .vis-d__head code { display: block; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .vis-back { display: none; }
    .vis-d__box { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .vis-d__name { font-size: 18px; }
    .vis-d__wa { background: #f1fbf5; border-color: #bfe3cc; }
    .btn--wa { background: #25d366; color: #fff; border-color: #25d366; text-decoration: none; }
    .btn--clarity { background: var(--gold-soft); border-color: #f0dfb3; color: #8a5a06; text-decoration: none; }
    .vis-item { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13px; }
    .vis-timeline { list-style: none; margin: 0; padding: 0 14px 0 0; border-inline-start: 2px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .vis-timeline li { position: relative; display: flex; flex-direction: column; font-size: 13px; }
    .vis-timeline li::before { content: ''; position: absolute; inset-inline-start: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .vis-timeline span { color: var(--muted); overflow-wrap: anywhere; }
    .vis-timeline small { color: var(--muted); font-size: 11px; }
    @media (max-width: 860px) {
      .vis-stats { grid-template-columns: repeat(2, 1fr); }
      .vis-stats > div:last-child { grid-column: 1 / -1; }
      .vis-search { grid-template-columns: 1fr 1fr; }
      .vis-search [data-vq] { grid-column: 1 / -1; }
      .vis-src { grid-template-columns: repeat(3, 1fr); }
      .vis-src > div:nth-child(4) { border-inline-start: 0; }
      .vis-src > div:nth-child(n+4) { border-top: 1px solid var(--line); }
      .vis-grid { grid-template-columns: 1fr; }
      .vis-detail { display: none; position: static; }
      .vis-detail.is-on { display: flex; }
      .vis-grid:has(.vis-detail.is-on) .vis-side { display: none; }
      .vis-back { display: inline-flex; }
    }
    .btn--cancel { background: #fff; border-color: #f3c6c1; color: #a3271b; }
    .btn--ship { background: #fff4ea; border-color: #f6cfa8; color: #9a4b07; }
    .btn--ship.is-done { background: #ecfdf3; border-color: #b7ebc9; color: #15803d; font-family: ui-monospace, Consolas, monospace; }
    .odet__shipform { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .odet__shipform label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .odet__ship > .btn--primary { align-self: flex-start; }
    @media (max-width: 860px) { .odet__grid { grid-template-columns: 1fr; } .odet__copy { font-size: 11px; } .odet__shipform { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .odet__pair { grid-template-columns: 1fr; } }
    .toast { border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); }
    @media (max-width: 860px) { .wrap { padding: 12px; } .hero { padding: 16px 16px 32px; } .hero h1 { font-size: 18px; } .tabs { margin-inline: 8px; } .stat b { font-size: 20px; } }
  </style>
</head>
<body>
<div class="wrap">
  <div id="demo-bar" class="demo-bar" hidden>وضع تجربة: هذه بيانات تجريبية ولا يتم حفظ أي شيء في المتجر.</div>
  <div class="top">
    <div class="hero">
      <span class="hero__logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="3.5" rx="1"/><path d="M10.5 5.5v3M13.5 5.5v3"/><rect x="5" y="8.5" width="14" height="13.5" rx="3.5"/><path d="M9 14.5h6"/></svg></span>
      <div>
        <h1>مدير عطور عصفور</h1>
        <p>الطلبات والعطور والعروض والتصنيفات، كلها بمكان واحد</p>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="orders" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>الطلبات</button>
      <button class="tab" role="tab" data-tab="visits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>السلال</button>
      <button class="tab" role="tab" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="3.5" rx="1"/><path d="M10.5 5.5v3M13.5 5.5v3"/><rect x="5" y="8.5" width="14" height="13.5" rx="3.5"/></svg>العطور</button>
      <button class="tab" role="tab" data-tab="preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>معاينة ترتيب الزبون</button>
      <button class="tab" role="tab" data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1"/></svg>التصنيفات</button>
      <button class="tab" role="tab" data-tab="offers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>العروض</button>
      <button class="tab" role="tab" data-tab="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>المحذوفة</button>
    </div>
  </div>

  <div id="app"><div class="loading">جاري تحميل العطور…</div></div>
</div>

<dialog id="dlg"></dialog>
<dialog id="ask" style="width:min(420px, calc(100vw - 24px))"></dialog>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  const API = 'shopify:admin/api/2025-10/graphql.json';
  const HIDE_TAG = 'مخفي-من-العروض';
  const SOURCE_HANDLE = 'perfumes';            // the collection the offer picker lists
  const SKIP_TYPES = ['عرض', 'بكج', 'خدمة'];   // offers, bundles and service products are not perfumes
  const SERVICE_TAG = 'منتج-خدمة';
  const BANNER_ALT = 'offer-banner';           // alt text the theme looks for to show the image under the timer
  const SKIP_COLLECTIONS = ['frontpage', 'offers'];
  const FAMILIES = ['فانيليا', 'خشبي', 'توابل', 'زهري', 'حمضيات', 'عود'];
  const GENDERS = ['رجالي', 'نسائي', 'للجنسين'];
  // Shopify always opens an embedded app with ?shop=…&host=…; anything else is the offline demo.
  const params = new URLSearchParams(location.search);
  const DEMO = !(params.has('host') || params.has('shop'));

  const S = { products: [], collections: [], offers: [], locationId: null, onlinePub: null, optionName: 'Size',
              priorityType: 'number_integer', tab: 'orders', filter: 'all', q: '', cat: '', sort: 'priority', selected: new Set(), productsReady: false,
              orders: null, ordersLoading: false, orderFilter: 'new', orderSettings: null, shopId: null, openOrders: new Set(), ship: {}, shipStatus: {},
              visits: { filter: 'incomplete', q: '', from: '', to: '', empty: false, list: null, stats: null, more: false, sel: null, detail: null, loading: false } };

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = v => (v === '' || v == null || isNaN(Number(v)) ? null : Number(v));

  function toast(msg, err = false) {
    if (!DEMO && window.shopify?.toast) return shopify.toast.show(msg, { isError: err, duration: err ? 6000 : 2500 });
    const t = $('#toast');
    t.textContent = msg; t.classList.toggle('is-err', err); t.classList.add('is-on');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('is-on'), err ? 6000 : 2500);
  }

  /* ---------------- Admin API ---------------- */
  async function gql(query, variables = {}) {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
    const j = await res.json();
    if (j.errors) throw new Error(j.errors.map(e => e.message).join(' | '));
    return j.data;
  }
  // Every mutation returns userErrors; surface them as one exception.
  function check(payload) {
    const errs = payload?.userErrors || [];
    if (errs.length) throw new Error(errs.map(e => e.message).join(' | '));
    return payload;
  }

  const PRODUCT_FIELDS = `
    id title handle status productType tags vendor
    featuredMedia { preview { image { url(transform: { maxWidth: 160 }) } } }
    priority: metafield(namespace: "custom", key: "priority") { value type }
    english: metafield(namespace: "custom", key: "english_name") { value }
    options(first: 3) { name }
    collections(first: 30) { nodes { id } }
    variants(first: 20) { nodes { id title price compareAtPrice inventoryQuantity
      inventoryItem { id tracked inventoryLevels(first: 1) { nodes { location { id } } } } } }`;

  function mapProduct(n) {
    return {
      id: n.id, title: n.title, handle: n.handle, status: n.status, type: n.productType || '', tags: n.tags || [],
      english: n.english?.value || '', priority: num(n.priority?.value), image: n.featuredMedia?.preview?.image?.url || '',
      optionName: n.options?.[0]?.name, collections: n.collections.nodes.map(c => c.id),
      variants: n.variants.nodes.map(v => ({ id: v.id, title: v.title, price: v.price, compareAt: v.compareAtPrice,
        qty: v.inventoryQuantity ?? 0, invItem: v.inventoryItem.id, tracked: v.inventoryItem.tracked,
        loc: v.inventoryItem.inventoryLevels.nodes[0]?.location.id })),
      _ptype: n.priority?.type
    };
  }

  const live = {
    async load() {
      const products = [];
      let after = null;
      do {
        const d = await gql(`query($after: String) { products(first: 100, after: $after) {
          pageInfo { hasNextPage endCursor } nodes { ${PRODUCT_FIELDS} } } }`, { after });
        products.push(...d.products.nodes);
        after = d.products.pageInfo.hasNextPage ? d.products.pageInfo.endCursor : null;
      } while (after);

      const d2 = await gql(`{ collections(first: 100) { nodes { id title handle productsCount { count }
          ruleSet { appliedDisjunctively rules { column relation condition } } } }
        publications(first: 20) { nodes { id name } } }`);

      S.collections = d2.collections.nodes.map(c => ({ id: c.id, title: c.title, handle: c.handle, count: c.productsCount?.count ?? 0,
        smart: !!c.ruleSet, any: c.ruleSet?.appliedDisjunctively ?? false, rules: c.ruleSet?.rules || [] }));
      S.onlinePub = (d2.publications.nodes.find(p => /online store/i.test(p.name)) || {}).id || null;

      const all = products.map(mapProduct);
      S.offers = all.filter(p => ['عرض', 'بكج'].includes(p.type));
      S.products = all.filter(p => !SKIP_TYPES.includes(p.type) && !p.tags.includes(SERVICE_TAG));
      const withLoc = all.flatMap(p => p.variants).find(v => v.loc);
      S.locationId = withLoc?.loc || null;
      const pt = all.find(p => p._ptype); if (pt) S.priorityType = pt._ptype;
      const names = S.products.map(p => p.optionName).filter(Boolean);
      if (names.length) S.optionName = mode(names);
    },

    async setPriority(p, value) {
      const d = await gql(`mutation($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { userErrors { message } } }`,
        { m: [{ ownerId: p.id, namespace: 'custom', key: 'priority', type: S.priorityType, value: String(value) }] });
      check(d.metafieldsSet);
    },
    async setPriorities(list) {               // [{p, value}] in chunks of 25 (API limit)
      for (let i = 0; i < list.length; i += 25) {
        const m = list.slice(i, i + 25).map(({ p, value }) => ({ ownerId: p.id, namespace: 'custom', key: 'priority', type: S.priorityType, value: String(value) }));
        const d = await gql(`mutation($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { userErrors { message } } }`, { m });
        check(d.metafieldsSet);
      }
    },
    async addTags(p, tags) {
      if (!tags.length) return;
      check((await gql(`mutation($id: ID!, $t: [String!]!) { tagsAdd(id: $id, tags: $t) { userErrors { message } } }`, { id: p.id, t: tags })).tagsAdd);
    },
    async removeTags(p, tags) {
      if (!tags.length) return;
      check((await gql(`mutation($id: ID!, $t: [String!]!) { tagsRemove(id: $id, tags: $t) { userErrors { message } } }`, { id: p.id, t: tags })).tagsRemove);
    },
    async setStock(p, perVariant) {           // perVariant: Map(variantId -> qty)
      const loc = S.locationId;
      if (!loc) throw new Error('لم يتم العثور على موقع المخزون');
      for (const v of p.variants) {
        if (!perVariant.has(v.id) || v.tracked) continue;
        check((await gql(`mutation($id: ID!) { inventoryItemUpdate(id: $id, input: { tracked: true }) { userErrors { message } } }`, { id: v.invItem })).inventoryItemUpdate);
      }
      const quantities = p.variants.filter(v => perVariant.has(v.id)).map(v => ({ inventoryItemId: v.invItem, locationId: v.loc || loc, quantity: perVariant.get(v.id) }));
      const d = await gql(`mutation($i: InventorySetQuantitiesInput!) { inventorySetQuantities(input: $i) { userErrors { message } } }`,
        { i: { name: 'available', reason: 'correction', ignoreCompareQuantity: true, quantities } });
      check(d.inventorySetQuantities);
    },
    async setStatus(p, status) {
      check((await gql(`mutation($p: ProductUpdateInput!) { productUpdate(product: $p) { userErrors { message } } }`, { p: { id: p.id, status } })).productUpdate);
    },
    async destroy(p) {
      check((await gql(`mutation($id: ID!) { productDelete(input: { id: $id }) { userErrors { message } } }`, { id: p.id })).productDelete);
    },
    async addToCollection(colId, p) {
      check((await gql(`mutation($id: ID!, $p: [ID!]!) { collectionAddProducts(id: $id, productIds: $p) { userErrors { message } } }`, { id: colId, p: [p.id] })).collectionAddProducts);
    },
    async removeFromCollection(colId, p) {
      check((await gql(`mutation($id: ID!, $p: [ID!]!) { collectionRemoveProducts(id: $id, productIds: $p) { userErrors { message } } }`, { id: colId, p: [p.id] })).collectionRemoveProducts);
    },
    async updateBasics(p, { title, type, english }) {
      check((await gql(`mutation($p: ProductUpdateInput!) { productUpdate(product: $p) { userErrors { message } } }`,
        { p: { id: p.id, title, productType: type } })).productUpdate);
      const d = await gql(`mutation($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { userErrors { message } } }`,
        { m: [{ ownerId: p.id, namespace: 'custom', key: 'english_name', type: 'single_line_text_field', value: english || ' ' }] });
      check(d.metafieldsSet);
    },
    async updatePrices(p, rows) {             // rows: [{id, price, compareAt}]
      if (!rows.length) return;
      const d = await gql(`mutation($pid: ID!, $v: [ProductVariantsBulkInput!]!) { productVariantsBulkUpdate(productId: $pid, variants: $v) { userErrors { message } } }`,
        { pid: p.id, v: rows.map(r => ({ id: r.id, price: r.price, compareAtPrice: r.compareAt || null })) });
      check(d.productVariantsBulkUpdate);
    },
    async uploadImage(file) {
      const d = await gql(`mutation($i: [StagedUploadInput!]!) { stagedUploadsCreate(input: $i) {
          stagedTargets { url resourceUrl parameters { name value } } userErrors { message } } }`,
        { i: [{ resource: 'IMAGE', filename: file.name, mimeType: file.type || 'image/jpeg', httpMethod: 'POST', fileSize: String(file.size) }] });
      const t = check(d.stagedUploadsCreate).stagedTargets[0];
      const form = new FormData();
      t.parameters.forEach(x => form.append(x.name, x.value));
      form.append('file', file);
      const up = await fetch(t.url, { method: 'POST', body: form });
      if (!up.ok) throw new Error('فشل رفع الصورة');
      return t.resourceUrl;
    },
    async loadOfferDetails(o) {
      const d = await gql(`query($id: ID!) { product(id: $id) {
          media(first: 30) { nodes { id alt ... on MediaImage { image { url(transform: { maxWidth: 300 }) } } } }
          config: metafield(namespace: "custom", key: "offer_config") { value } } }`, { id: o.id });

  // How membership in a collection can be changed for this product.
  function catControl(col) {
    if (!col.smart) return { kind: 'manual' };
    const tagRules = col.rules.filter(r => r.column === 'TAG' && r.relation === 'EQUALS');
    if (tagRules.length && (col.any || col.rules.length === 1)) return { kind: 'tag', tag: tagRules[0].condition, tags: tagRules.map(r => r.condition) };
    return { kind: 'auto' };
  }
  function matchesRule(p, r) {
    const val = { TAG: null, TYPE: p.type, TITLE: p.title, VENDOR: p.vendor }[r.column];
    if (r.column === 'TAG') return r.relation === 'EQUALS' ? p.tags.includes(r.condition) : r.relation === 'NOT_EQUALS' ? !p.tags.includes(r.condition) : null;
    if (val == null) return null;
    if (r.relation === 'EQUALS') return val === r.condition;
    if (r.relation === 'NOT_EQUALS') return val !== r.condition;
    if (r.relation === 'CONTAINS') return val.includes(r.condition);
    if (r.relation === 'NOT_CONTAINS') return !val.includes(r.condition);
    return null;
  }
  // Smart collections update on Shopify's side; mirror the result locally so the UI is right immediately.
  function syncSmartCollections(p) {
    S.collections.filter(c => c.smart).forEach(c => {
      const res = c.rules.map(r => matchesRule(p, r));
      if (res.some(x => x === null)) return;
      const yes = c.any ? res.some(Boolean) : res.every(Boolean);
      const has = p.collections.includes(c.id);
      if (yes && !has) p.collections.push(c.id);
      if (!yes && has) p.collections = p.collections.filter(id => id !== c.id);
    });
  }

        case 'out': return !inStock(p);

  // Prices the theme reads from the variants (option1 size, option2 grade). A perfume tagged top-grade-only

  const STANDARD_PRICE = { 110: 15, 50: 11 };
  function gradeInfo(p) {
    const r = { n110: null, n50: null, g110: null, g50: null, compare: null };
    for (const v of p.variants) {
      const big = /110/.test(v.title), top = v.title.includes('نخب أول'), price = Number(v.price);
      r[(top ? 'g' : 'n') + (big ? 110 : 50)] = price;

    return { ...r, price110: r.n110 ?? r.g110, price50: r.n50 ?? r.g50,

  // Shrink an image before upload: at most `maxW` wide, re-encoded as WebP (far smaller than PNG).
  async function toWebp(file, maxW = 1200, quality = 0.82) {
    if (!file || !file.type.startsWith('image/') || file.type === 'image/gif') return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, maxW / bmp.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/webp', quality));
      if (!blob || blob.size >= file.size) return file;  // keep the original if WebP isn't smaller
      return new File([blob], file.name.replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' });
    } catch { return file; }
  }

  /* ---------------- Orders & WhatsApp ---------------- */

  // owner presses send. Progress is kept as order tags; confirmed orders are posted to a Google Sheet
  // through an Apps Script web app (settings live in the shop's custom.order_messages metafield).
  // A top-grade pick carries its extra at the end of its name: "… (نخب أول) +5 د.أ".
  const EXTRA_RE = /\s*\+(\d+(?:\.\d+)?)\s*د\.أ\s*$/;
  const TAG_SENT = 'رسالة-التأكيد-انبعتت';
  const TAG_CONFIRMED = 'مؤكد';

    sheet_url: '', secret: ''
  };
  const ORDER_STATES = { new: ['جديد', 'badge--draft'], sent: ['بانتظار رد الزبون', 'badge--hidden'], confirmed: ['مؤكد', 'badge--ok'],
    postponed: ['مؤجل', 'badge--hidden'], delivered: ['تم التسليم', 'badge--ok'], cancelled: ['ملغي', 'badge--out'] };
  // Status after confirmation, kept as one order tag each; the value is what the sheet's «حالة الاوردر» column gets.
  const STATUS_TAGS = { postponed: ['مؤجل', 'مؤجل'], delivered: ['تم-التسليم', 'تم التوصيل'], cancelled: ['ملغي', 'ملغي'] };
  // What the sheet shows for a confirmed order that has no later status yet.
  const SHEET_CONFIRMED = 'قيد التوصيل';
  const ORDER_FIELDS = `id name createdAt cancelledAt tags note customAttributes { key value }
    totalPriceSet { shopMoney { amount } } subtotalPriceSet { shopMoney { amount } } totalShippingPriceSet { shopMoney { amount } } phone
    customer { firstName lastName phone }
    shippingAddress { firstName lastName phone address1 address2 city }
    lineItems(first: 50) { nodes { title variantTitle quantity image { url } originalUnitPriceSet { shopMoney { amount } } customAttributes { key value } } }`;

  function mapOrder(n) {
    const a = n.shippingAddress || {}, c = n.customer || {};
    const phone = a.phone || n.phone || c.phone || '';
    const total = Number(n.totalPriceSet.shopMoney.amount), shipping = Number(n.totalShippingPriceSet?.shopMoney.amount || 0);
    return {
      id: n.id, name: n.name, createdAt: n.createdAt, cancelled: !!n.cancelledAt, tags: n.tags || [], note: n.note || '',
      // Orders from the cart page carry the Direct Delivery area the customer picked.
      deliveryVillage: Number((n.customAttributes || []).find(a => a.key === '_delivery_village_id')?.value) || 0,
      total, shipping, subtotal: Number(n.subtotalPriceSet?.shopMoney.amount ?? total - shipping),
      customer: [a.firstName || c.firstName, a.lastName || c.lastName].filter(Boolean).join(' ') || 'زبون',
      phone, city: a.city || '', address: [a.address1, a.address2].filter(Boolean).join(' / '),
      // A second number the customer gave elsewhere (contact field or account), if it differs.
      altPhone: [n.phone, c.phone].find(p => p && waPhone(p) !== waPhone(phone)) || (n.customAttributes || []).find(a => a.key === 'رقم بديل')?.value || '',
      // Offer choices travel as line item properties; hidden (_) ones and the upcharge line's own notes are left out.
      items: n.lineItems.nodes.map(li => ({ title: li.title, variant: li.variantTitle || '', qty: li.quantity, price: Number(li.originalUnitPriceSet.shopMoney.amount), image: li.image?.url || '',
        attrs: li.customAttributes, props: li.customAttributes.filter(x => !x.key.startsWith('_') && !['للعرض', 'العطور'].includes(x.key))
          .map(x => {
            const m = x.key.match(/\((110|50) مل\)/), extra = x.value.match(EXTRA_RE);
            const name = x.value.replace(EXTRA_RE, '');
            return m ? `${name} ${m[1]}مل${extra ? ` (+${extra[1]} د.أ)` : ''}` : x.value;
          }) }))
    };
  }
  const orderState = o => (o.cancelled ? 'cancelled'
    : Object.keys(STATUS_TAGS).find(k => o.tags.includes(STATUS_TAGS[k][0]))
      || (o.tags.includes(TAG_CONFIRMED) ? 'confirmed' : o.tags.includes(TAG_SENT) ? 'sent' : 'new'));
  const jod = n => `${n.toFixed(2)} د.أ.`;

  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  function ammanNow() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Amman', weekday: 'short', hour: 'numeric', hourCycle: 'h23' })
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return { day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday), hour: Number(p.hour) };
  }
  // Two delivery days starting tomorrow (the day after from 6 PM on), skipping Friday.
  function deliveryText() {
    const { day, hour } = ammanNow();
    let d = (day + (hour >= 18 ? 2 : 1)) % 7, friday = day === 4;
    const next = () => { if (d === 5) { friday = true; d = 6; } const r = d; d = (d + 1) % 7; return r; };
    const a = next(), b = next();
    return `التوصيل بكون ${DAYS[a]} أو ${DAYS[b]} بإذن الله${friday ? ' (لأن يوم الجمعة عطلة)' : ''} 🌹`;
  }
  function itemsText(o, wa = true) {
    const b = wa ? '*' : '';
    // The top-grade difference line is internal; the total already includes it.
    return o.items.filter(li => !li.attrs.some(a => a.key === 'للعرض')).map(li => {
      // A single perfume (no offer slots) carries its size and grade in the variant: "110ML / نخب أول".
      const size = !li.props.length && li.variant.match(/(110|50)/);
      const name = size ? `${li.title}${li.variant.includes('نخب أول') ? ' (نخب أول)' : ''} ${size[1]}مل` : li.title;
      return [`• ${name}${li.qty > 1 ? ` × ${li.qty}` : ''} — ${b}${jod(li.price * li.qty)}${b}`, ...li.props.map(v => `   ◦ ${v}`)].join('\n');
    }).join('\n');
  }
  function fillMessage(tpl, o) {
    const vars = { 'وقت التحية': ammanNow().hour < 12 ? 'صباح الخير' : 'مساء الخير', 'اسم العميل': o.customer, 'تفاصيل العطور': itemsText(o),
      'المبلغ': jod(o.total), 'العنوان': [o.city, o.address].filter(Boolean).join(' / '), 'موعد التوصيل': deliveryText(), 'رقم الطلب': o.name.replace('#', '') };
    // "---" lines split the automatic message into parts; a wa.me link carries one text, so join them.
    return tpl.replace(/\[([^\]]+)\]/g, (m, k) => vars[k] ?? m).split(/\n\s*-{3,}\s*\n/).map(t => t.trim()).join('\n\n');
  }
  // Jordanian numbers come as 07…, +962…, 00962… or 7…; wa.me wants 9627… digits only.
  function waPhone(raw) {
    let d = String(raw || '').replace(/\D/g, '');
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('0')) d = '962' + d.slice(1);
    else if (d.length === 9 && d.startsWith('7')) d = '962' + d;
    return d;
  }
  // Must run synchronously inside the click, or the browser blocks the new window.
  function openWhatsApp(o, text) {
    const phone = waPhone(o.phone);
    if (!phone) { toast('ما في رقم هاتف على هذا الطلب', true); return false; }
    const a = document.createElement('a');
    // api.whatsapp.com directly: the wa.me redirect turns emoji into "�".
    a.href = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  }

  // Top-grade perfume → its exact name in the «الصنف» column of the sheet's «الإعدادات» tab, which the
  // price and Omran-share formulas look up (store and sheet spell many of them differently).
  const SHEET_GRADE_KEYS = {
    blackafgano: 'بلاك افغانو\n(فقط صنف عالي)', imaginationlouisvuitton: 'ايماجنيشن', 'gd-of-fire': 'قو* اوف فاير\n(فقط صنف عالي)',
    strongerwithyouintensely: 'يو انتنسلي', laytondemarly: 'لايتون ديمارلي\n(فقط صنف عالي)', 'oud-maracuj': 'عود ماراكوجا\n(فقط صنف عالي)',
    strongerwithyousandalwood: 'يو صندل\n(فقط صنف عالي)', strongerwithyouparfum: 'يو بارفوم\n(فقط صنف عالي)', jazzclubreplica: 'جاز كلوب\n(فقط صنف عالي)',
    lebeauleparfum: 'لي بو لي بارفوم', erosnajimversace: 'فرزاتشي ايروس نجم\n(فقط صنف عالي)', interludemanamouage: 'امواج انترلود\n(فقط صنف عالي)',
    intenseoudgucci: 'قوتشي عود انتنس\n(فقط صنف عالي)', bleudechanel: 'بلو دي شانل\n(فقط صنف عالي)', sauvagedior: 'سوفاج\n(فقط صنف عالي)',
    aventuscreed: 'كريد افينتوس\n(فقط صنف عالي)', biancolatte: 'بيانكو لاتيه\n(فقط صنف عالي)', 'summer-hammer': 'سمر همر',
    sauvageelixir: 'سوفاج الكسير\n(فقط صنف عالي)'
  };

  // Line items that are real products (the top-grade difference line is internal; the total already includes it).
  const orderLines = o => o.items.filter(li => !li.attrs.some(a => a.key === 'للعرض'));
  const slotAttrs = li => li.attrs.filter(a => !a.key.startsWith('_') && /\((110|50) مل\)/.test(a.key));
  // One entry per perfume: the offer's picks, or a single perfume once per unit (its grade sits in the variant).
  function itemEntries(li, byTitle) {
    const picks = slotAttrs(li);
    const raw = picks.length
      ? picks.map(a => ({ name: a.value.replace(EXTRA_RE, ''), size: a.key.includes('110') ? '110' : '50', gift: a.key.includes('هدية'), extra: Number(a.value.match(EXTRA_RE)?.[1] || 0) }))
      : Array.from({ length: li.qty }, () => ({ name: li.title + (li.variant.includes('نخب أول') ? ' (نخب أول)' : ''), size: /110/.test(li.variant) ? '110' : '50', gift: false, extra: 0 }));
    return raw.map(e => {
      const base = e.name.replace(/\s*\((نخب أول|صنف عالي)\)\s*$/, ''), product = byTitle.get(base);
      // Top-grade-only perfumes at the normal price no longer carry the label in their name.
      return { ...e, base, product, top: e.name.includes('(نخب أول)') || !!product?.tags.includes('نخب-أول-فقط') };
    });
  }
  const productsByTitle = () => new Map(S.products.map(p => [p.title, p]));

  // The row the way the owner's sheet («الطلبات» tab) is filled by hand: English names with sizes, the
  // offer label its price lookup knows, and each top-grade pick in its own column pair.
  function sheetRow(o) {
    const byTitle = productsByTitle();
    const lines = [], premium = [];
    let n110 = 0, n50 = 0, gift = false;
    for (const li of orderLines(o)) {
      for (const e of itemEntries(li, byTitle)) {
        lines.push(`${e.product?.english || e.base}${e.top ? ' (نخب أول)' : ''} ${e.size}ml`);
        if (e.top) premium.push({ name: SHEET_GRADE_KEYS[e.product?.handle] || e.base, size: e.size + 'مل' });
        if (e.gift) gift = true; else if (e.size === '110') n110++; else n50++;
      }
    }
    const count = (n, size) => (n === 1 ? `علبة ${size}مل` : n === 2 ? `علبتين ${size}مل` : `${n} علب ${size}مل`);
    const offer = [n110 && count(n110, 110), n50 && count(n50, 50), gift && 'علبة 50مل'].filter(Boolean).join(' + ');
    const next = (ammanNow().day + 1) % 7;
    const wa = waPhone(o.phone);
    return {
      day: ['الاحد', 'الاثنين', 'الثلاثاء', 'الاربعاء', 'الخميس', 'الجمعة', 'السبت'][next === 5 ? 6 : next] + '\\',
      customer: o.customer, offer, details: lines.join('\n') + '\n.', note: o.note,
      location: [o.city, o.address].filter(Boolean).join(' / '), phone: wa.startsWith('962') ? '0' + wa.slice(3) : o.phone,
      date: new Date(o.createdAt).toLocaleDateString('en-CA', { timeZone: 'Asia/Amman' }), area: /عم+ان|عمّان/.test(o.city) ? 'داخل' : 'خارج',
      premium: premium.slice(0, 4), total: o.total, status: SHEET_CONFIRMED
    };
  }

  async function postToSheet(o) {
    const st = S.orderSettings;
    const body = JSON.stringify({ secret: st.secret, order: o.name, ...sheetRow(o) });
    if (DEMO) return;
    // text/plain keeps it a simple request (no CORS preflight, which Apps Script can't answer).
    // A script crash comes back as an HTML page without CORS headers, so it shows up here as a network error;
    // no retry, since the script may already have written part of the row.
    let res;
    try { res = await fetch(st.sheet_url, { method: 'POST', body }); }
    catch { throw new Error('الشيت ما رد صح. شيك على تبويب الطلبات قبل ما تعيد التأكيد'); }
    const j = await res.json().catch(() => ({ ok: false, error: 'رد غير مفهوم من الشيت' }));
    if (!j.ok) throw new Error(j.error || 'الشيت رفض الطلب، تأكد من الرابط والرمز');
  }

  // The orders worker (asfour-orders-worker) sends the confirmation message by itself when an order
  // comes in; mark those orders as sent here. Its URL and key live in the order_messages settings.
  async function syncAutoSent() {
    const st = S.orderSettings;
    if (DEMO || !st.worker_url || !st.worker_key) return;
    const r = await fetch(`${st.worker_url}/sent`, { headers: { 'X-Asfour-Key': st.worker_key } }).then(x => x.json()).catch(() => null);
    if (!r?.ok) return;
    for (const o of S.orders) {
      const id = o.id.split('/').pop();
      if (r.orders[id] === 'sent' && orderState(o) === 'new') {
        try { await api.addTags(o, [TAG_SENT]); o.tags.push(TAG_SENT); } catch (e) { console.error(e); }
      }
    }
  }

  async function loadOrders() {
    if (S.ordersLoading) return;
    S.ordersLoading = true;
    try { await api.loadOrders(); await syncAutoSent(); }
    catch (e) {
      console.error(e);
      S.orders = null;
      const scope = /access|scope|approved|protected/i.test(e.message);
      if (S.tab === 'orders') app.innerHTML = `<div class="card empty">تعذّر تحميل الطلبات: ${esc(e.message)}
        ${scope ? '<br><br>التطبيق محتاج صلاحية قراءة الطلبات وبيانات الزبائن. افتح التطبيق من جديد ووافق على التحديث.' : ''}
        <br><br><button class="btn" data-oreload>إعادة المحاولة</button></div>`;
      return;
    } finally { S.ordersLoading = false; }
    if (S.tab === 'orders') render();
  }

  function renderOrders() {
    if (!S.orders) { app.innerHTML = '<div class="loading">جاري تحميل الطلبات…</div>'; loadOrders(); return; }
    const counts = {};
    S.orders.forEach(o => (counts[orderState(o)] = (counts[orderState(o)] || 0) + 1));
    const list = S.orders.filter(o => S.orderFilter === 'all' || orderState(o) === S.orderFilter);
    app.innerHTML = `
      ${S.orderSettings.sheet_url ? '' : '<div class="note note--warn">لسا ما ربطت جوجل شيت. اكبس «الإعدادات» وتابع الخطوات عشان الطلبات المؤكدة تنرفع عليه.</div>'}
      <div class="stats" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">
        ${['all', 'new', 'sent', 'confirmed', 'postponed', 'delivered', 'cancelled'].map(k => `<button class="stat" data-ofilter="${k}" aria-pressed="${S.orderFilter === k}">
          <b>${k === 'all' ? S.orders.length : counts[k] || 0}</b>${k === 'all' ? 'كل الطلبات' : ORDER_STATES[k][0]}</button>`).join('')}
      </div>
      <div class="card">
        <div class="toolbar"><span class="grow muted small">آخر ${S.orders.length} طلب. «رسالة التأكيد» بتفتح الواتساب والرسالة جاهزة، وإنت بتكبس إرسال.</span>
          <button class="btn btn--sm" data-oreload>تحديث</button><button class="btn btn--sm" data-osettings>الإعدادات</button></div>
        ${list.map(orderRow).join('') || '<div class="empty">ما في طلبات هون</div>'}
      </div>`;
  }

  function orderRow(o) {
    const st = orderState(o), [label, cls] = ORDER_STATES[st];
    const date = new Date(o.createdAt).toLocaleString('ar-JO', { timeZone: 'Asia/Amman', day: 'numeric', month: 'numeric', hour: 'numeric', minute: '2-digit' });
    const confirmed = o.tags.includes(TAG_CONFIRMED);
    const buttons = (st === 'new' || st === 'sent' ? `<button class="btn btn--sm" data-oact="send">📩 ${st === 'new' ? 'رسالة التأكيد' : 'إعادة الرسالة'}</button>
      <button class="btn btn--sm btn--primary" data-oact="confirm">✅ تم التأكيد</button>` : '')
      + (st === 'confirmed' ? '<button class="btn btn--sm" data-oact="unconfirm">تراجع عن التأكيد</button>' : '')
      // A Shopify-cancelled order stays cancelled; everything else can move between the statuses, and a
      // cancelled one can go back (the customer may change their mind).
      + (o.cancelled ? '' : `<select class="input" data-ostatus style="width:auto;padding:4px 8px">
        ${(confirmed ? ['confirmed', 'postponed', 'delivered', 'cancelled'] : [o.tags.includes(TAG_SENT) ? 'sent' : 'new', 'cancelled'])
          .map(k => `<option value="${k}" ${k === st ? 'selected' : ''}>${k === st ? 'الحالة: ' : ''}${ORDER_STATES[k][0]}</option>`).join('')}</select>`)
      + (st === 'cancelled' ? '' : '<button class="btn btn--sm btn--cancel" data-oact="cancel">❌ انلغى الأوردر</button>')
      + '<button class="btn btn--sm btn--danger" data-oact="delete">🗑️ حذف</button>';
    // Delivery: one click uploads with the area the customer picked (or the guess); once uploaded, the barcode opens the details.
    const barcode = shipBarcode(o);
    const ship = barcode ? `<button class="btn btn--sm btn--ship is-done" data-otoggle title="رقم الشحنة">🚚 ${esc(barcode)}</button>`
      : o.cancelled || st === 'cancelled' ? '' : '<button class="btn btn--sm btn--ship" data-ship="create">🚚 رفع لشركة التوصيل</button>';
    const open = S.openOrders.has(o.id);
    return `<div class="order${st === 'cancelled' ? ' is-cancelled' : ''}${open ? ' is-open' : ''}" data-order-id="${o.id}">
      <div class="order__head"><b>${esc(o.name)}</b><span class="badge ${cls}">${label}</span><span class="muted small" style="margin-inline-start:auto">${esc(date)}</span></div>
      <div><b>${esc(o.customer)}</b> · <span dir="ltr">${esc(o.phone || 'بدون رقم')}</span></div>
      ${o.city || o.address ? `<div class="muted small">${esc([o.city, o.address].filter(Boolean).join(' / '))}</div>` : ''}
      ${open ? orderDetail(o) : `<div class="order__items">${esc(itemsText(o, false))}</div>`}
      <div class="order__foot"><b>${jod(o.total)}</b><span class="actions">
        ${ship}<button class="btn btn--sm" data-otoggle aria-expanded="${open}">${open ? '▲ إخفاء التفاصيل' : '📋 التفاصيل'}</button>${buttons}</span></div>
    </div>`;
  }

  // Jordan's governorates in English for the English shipping summary; anything else stays as typed.
  const CITY_EN = { 'عمان': 'Amman', 'اربد': 'Irbid', 'الزرقاء': 'Zarqa', 'الزرقا': 'Zarqa', 'البلقاء': 'Balqa', 'السلط': 'Salt', 'مادبا': 'Madaba',
    'الكرك': 'Karak', 'الطفيلة': 'Tafilah', 'معان': "Ma'an", 'العقبة': 'Aqaba', 'المفرق': 'Mafraq', 'جرش': 'Jerash', 'عجلون': 'Ajloun', 'الرصيفة': 'Russeifa' };
  const cityEn = c => CITY_EN[String(c).trim().replace(/[أإآ]/g, 'ا').replace(/ّ/g, '')] || c;
  const plainJod = n => `${+Number(n).toFixed(2)} JOD`;

  // The copy-ready texts the old site's admin had: the sheet's «تفاصيل» cell and the shipping summary.
  function orderTexts(o) {
    const r = sheetRow(o);
    const summary = (en) => en
      ? `Customer Name: ${o.customer}\n\nPhone Number: ${r.phone}\n\nFull Address: ${[cityEn(o.city), o.address].filter(Boolean).join(' / ')}\n\nOrder Items (Excel Format):\n${r.details}\n\nTotal Amount (incl. delivery): ${plainJod(o.total)}`
      : `اسم العميل: ${o.customer}\n\nرقم الهاتف: ${r.phone}\n\nالعنوان الكامل: ${r.location}\n\nتفاصيل العطور (لشيت جوجل):\n${r.details}\n\nالمبلغ الكلي شامل التوصيل: ${plainJod(o.total)}`;
    return { sheet: r.details, en: summary(true), ar: summary(false), phone: r.phone, address: r.location };
  }

  function orderDetail(o) {
    const t = orderTexts(o), byTitle = productsByTitle();
    const copy = (text, label = 'نسخ') => `<button class="btn btn--sm odet__copy" data-copy="${esc(text)}">⧉ ${label}</button>`;
    const field = (label, value, copyIt = true, ltr = false) => `<div class="odet__field"><div><small>${label}</small>
      <b${ltr ? ' dir="ltr"' : ''}>${esc(value || 'لا يوجد')}</b></div>${copyIt && value ? copy(value) : ''}</div>`;
    const lines = orderLines(o);
    const items = lines.map(li => {
      const offer = slotAttrs(li).length > 0, entries = itemEntries(li, byTitle);
      const picks = offer ? `<div class="odet__picks"><div class="odet__picks-h">📦 عطور العرض المختارة من الزبون (${entries.length} عطور):</div>
        ${entries.map((e, i) => {
          const text = `${e.base} - ${e.size} مل${e.top ? ' (نخب أول)' : ''}${e.extra ? ` (+${e.extra.toFixed(2)} د.أ)` : ''}`;
          return `<div class="odet__pick"><span class="odet__n">${i + 1}</span>
            ${e.product?.image ? `<img src="${esc(e.product.image)}" alt="" loading="lazy">` : '<span class="odet__noimg"></span>'}
            <div class="grow"><b>${esc(e.base)}</b><div class="odet__tags"><span>${e.size} مل</span>${e.top ? '<span class="is-top">نخب أول</span>' : ''}
              ${e.extra ? `<span class="is-extra">+${e.extra.toFixed(2)} د.أ</span>` : ''}${e.gift ? '<span class="is-gift">🎁 هدية</span>' : ''}</div></div>
            ${copy(text)}</div>`;
        }).join('')}</div>` : '';
      return `<div class="odet__item"><div class="odet__item-h">
          ${li.image ? `<img src="${esc(li.image)}" alt="" loading="lazy">` : ''}
          <div class="grow">${offer ? '<span class="odet__badge">🎁 عرض باقة</span>' : ''}<b>${esc(li.title)}</b>
            <div class="muted small">${!offer && li.variant ? `${esc(li.variant)} · ` : ''}الكمية: ${li.qty}x</div></div>
          <b class="odet__price">${plainJod(li.price * li.qty)}</b></div>${picks}</div>`;
    }).join('');
    return `<div class="odet">
      <div class="odet__quick"><b>📋 نسخ سريع:</b>${copy(t.sheet, 'تفاصيل الطلب لشيت جوجل (English) 📊')}${copy(t.en, 'ملخص الشحن (English)')}${copy(t.ar, 'ملخص الشحن (عربي)')}</div>
      <div class="odet__grid">
        <section class="odet__box"><div class="odet__h"><span>👤 تفاصيل المستلم والعنوان</span>${copy(t.address, 'نسخ العنوان')}</div>
          ${field('اسم المستلم', o.customer)}
          <div class="odet__pair">${field('رقم الهاتف', t.phone, true, true)}${field('الهاتف البديل', o.altPhone, true, true)}</div>
          <div class="odet__field odet__field--addr"><div><small>العنوان الكامل</small>
            <div>المحافظة: <b>${esc(o.city || '—')}</b></div><div>المنطقة / المكان: <b>${esc(o.address || '—')}</b></div></div>${t.address ? copy(t.address) : ''}</div>
          ${o.note ? `<div class="odet__note"><small>📝 ملاحظة الزبون</small>${esc(o.note)}</div>` : ''}
        </section>
        <section class="odet__box"><div class="odet__h"><span>🛍️ المنتجات المطلوبة (${lines.length})</span>${copy(t.sheet, 'نسخ لشيت جوجل 📊')}</div>
          ${items}
          <div class="odet__sum"><div><span>المجموع الفرعي:</span><b>${plainJod(o.subtotal)}</b></div>
            <div><span>تكلفة التوصيل:</span><b>${o.shipping ? plainJod(o.shipping) : 'مجاني'}</b></div>
            <div class="is-total"><span>المجموع الإجمالي الكلي:</span><b>${plainJod(o.total)}</b></div></div>
        </section>
      </div>
      ${shipBox(o, copy)}
    </div>`;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('انتسخ ✓');
  }

  /* ---------------- Store visits («السلال») ---------------- */
  // Every visit to the store, reported by the theme's tracker (assets/track.js) to the orders worker: pages, cart,
  // what was typed on the order page, and whether it became an order. Unfinished ones can be followed up here.
  const CLARITY_PROJECT = 'y5raoznta8';
  const DEVICES = { ios: 'آيفون (iOS)', android: 'أندرويد', desktop: 'كمبيوتر' };
  const SOURCES = { instagram: 'إنستغرام', facebook: 'فيسبوك', google: 'جوجل', tiktok: 'تيك توك', direct: 'دخول مباشر' };
  const VISIT_FILTERS = [['all', 'الكل'], ['incomplete', 'غير مكتملة'], ['active', 'نشطة الآن'], ['idle', 'خاملة'], ['completed', 'مكتملة'], ['followed', 'تمت المتابعة'], ['ignored', 'تم التجاهل']];
  const EVENT_LABELS = { view: 'فتح صفحة', add: 'إضافة للسلة', cart: 'السلة', form: 'تعبئة بيانات الطلب', order: 'تم الطلب ✓', message: 'رسالة واتساب', status: 'تغيير الحالة' };
  const VISIT_MESSAGE = 'أهلاً بك، معك متجر عطور عصفور 👑 لاحظنا إنك ما كمّلت طلبك، بنقدر نساعدك؟ إذا بتحب نأكدلك الطلب ابعتلنا «تمام» 🌹';

  const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'الآن' : m < 60 ? `قبل ${m} د` : m < 1440 ? `قبل ${Math.round(m / 60)} س` : `قبل ${Math.round(m / 1440)} ي`; };
  const span = (a, b) => { const s = Math.max(0, Math.round((b - a) / 1000)); return s < 60 ? `${s}ث` : `${Math.floor(s / 60)}د ${s % 60}ث`; };
  const visitState = v => (v.stage === 'completed' ? ['مكتملة ✓', 'badge--ok'] : Date.now() - v.updated < 300000 ? ['نشطة الآن', 'badge--draft']
    : v.cart_value > 0 ? ['غير مكتملة', 'badge--out'] : ['تصفح فقط', 'badge--hidden']);
  const clarityUrl = id => `https://clarity.microsoft.com/projects/view/${CLARITY_PROJECT}/impressions?date=Last%2030%20days&Variables=sid%3A${encodeURIComponent(id)}`;

  async function workerGet(path, opts = {}) {
    if (!S.orderSettings) await api.loadOrders();
    const st = S.orderSettings;
    if (!st.worker_url || !st.worker_key) throw new Error('رابط السيرفر مش مضبوط بالإعدادات');
    const r = await fetch(st.worker_url + path, { ...opts, headers: { 'X-Asfour-Key': st.worker_key, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    const j = await r.json().catch(() => ({ ok: false, error: 'رد غير مفهوم' }));
    if (!j.ok) throw new Error(j.error || 'خطأ');
    return j;
  }

  function demoVisits() {
    const now = Date.now(), m = 60000;
    const v = (i, o) => ({ id: 'demo' + i + 'a8f3c2', created: now - o.age - (o.dur || 90000), updated: now - o.age, device: o.device, source: o.source, landing: o.landing || '/',
      last_path: o.last || '/cart', views: o.views || 3, name: o.name || null, phone: o.phone || null, gov: o.gov || null, area: o.area || null,
      cart_value: o.value || 0, cart_count: o.count || 0, stage: o.stage, order_name: o.order || null, status: o.status || '' });
    const list = [
      v(1, { age: 2 * m, device: 'android', source: 'instagram', stage: 'checkout', value: 32, count: 1, name: 'أحمد', phone: '0791234567', gov: 'عمان', area: 'خلدا', landing: '/products/offer-strong' }),
      v(2, { age: 40 * m, device: 'ios', source: 'instagram', stage: 'checkout', value: 50, count: 1, name: 'سارة', phone: '0785551234', gov: 'إربد', landing: '/products/offer-royal' }),
      v(3, { age: 3 * 60 * m, device: 'android', source: 'facebook', stage: 'cart', value: 20, count: 1, landing: '/products/offer-classic' }),
      v(4, { age: 5 * 60 * m, device: 'ios', source: 'instagram', stage: 'completed', value: 32, count: 1, name: 'محمد', phone: '0778889990', order: '#1015' }),
      v(5, { age: 20 * 60 * m, device: 'desktop', source: 'google', stage: 'checkout', value: 15, count: 1, status: 'followed', name: 'ليث', phone: '0799990000' })
    ];
    return { sessions: list, more: false, stats: { active: 1, idle: 1, incomplete: 4, pending: 3, value: 117, visits: 240, facebook: 30, instagram: 150, google: 12, ios: 90, android: 120, bounce: 25 } };
  }

  async function loadVisits(append = false) {
    const V = S.visits;
    if (V.loading) return;
    V.loading = true;
    try {
      let j;
      if (DEMO) j = demoVisits();
      else {
        const p = new URLSearchParams({ filter: V.filter, q: V.q, limit: '40', offset: append ? String(V.list?.length || 0) : '0' });
        if (V.empty) p.set('empty', '1');
        if (V.from) p.set('from', String(new Date(V.from + 'T00:00:00').getTime()));
        if (V.to) p.set('to', String(new Date(V.to + 'T23:59:59').getTime()));
        j = await workerGet('/sessions?' + p);
      }
      V.list = append ? V.list.concat(j.sessions) : j.sessions;
      V.stats = j.stats; V.more = j.more;
    } catch (e) { toast('تعذّر تحميل السلال: ' + e.message, true); V.list = V.list || []; }
    finally { V.loading = false; }
    if (S.tab === 'visits') render();
  }

  async function openVisit(id) {
    const V = S.visits;
    V.sel = id; V.detail = null;
    render();
    try {
      if (DEMO) {
        const s = V.list.find(x => x.id === id);
        V.detail = { session: { ...s, note: '', cart_json: JSON.stringify(s.cart_value ? [{ t: 'الأكثر طلباً | 4 عطور', v: '', q: 1, p: s.cart_value, props: ['العطر الأول (110 مل): سوفاج ديور', 'العطر الثاني (110 مل): خمرة قهوة'] }] : []) },
          events: [{ ts: s.updated, type: 'form', detail: 'تعبئة بيانات الطلب' }, { ts: s.updated - 60000, type: 'cart', detail: 'فتح صفحة السلة والطلب' },
            { ts: s.updated - 120000, type: 'add', detail: 'الأكثر طلباً | 4 عطور' }, { ts: s.created, type: 'view', detail: s.landing }] };
      } else V.detail = await workerGet('/sessions/' + encodeURIComponent(id));
    } catch (e) { toast('تعذّر فتح السلة: ' + e.message, true); }
    if (S.visits.sel === id) render();
  }

  function renderVisits() {
    const V = S.visits;
    if (!V.list) { app.innerHTML = '<div class="loading">جاري تحميل السلال…</div>'; loadVisits(); return; }
    const st = V.stats || {}, pct = n => (st.visits ? Math.round((n || 0) / st.visits * 100) : 0) + '%';
    const cards = [['نشطة الآن', st.active || 0], ['خاملة', st.idle || 0], ['غير مكتملة', st.incomplete || 0], ['بانتظار المتابعة', st.pending || 0], ['قيمة السلال للاسترداد', `${+(st.value || 0).toFixed(2)} د.أ`]];
    app.innerHTML = `
      <div class="vis-stats">${cards.map(([l, n]) => `<div><small>${l}</small><b>${n}</b></div>`).join('')}</div>
      <div class="card vis-bar">
        <div class="vis-chips">${VISIT_FILTERS.map(([k, l]) => `<button class="vis-chip" data-vfilter="${k}" aria-pressed="${V.filter === k}">${l}</button>`).join('')}</div>
        <div class="vis-search">
          <input class="input" type="search" placeholder="ابحث بالاسم، الرقم، المحافظة، رقم الطلب…" value="${esc(V.q)}" data-vq>
          <input class="input" type="date" value="${esc(V.from)}" data-vfrom aria-label="من تاريخ"><input class="input" type="date" value="${esc(V.to)}" data-vto aria-label="إلى تاريخ">
          <button class="btn btn--sm" data-vreload>🔄 تحديث</button>
        </div>
      </div>
      <div class="vis-grid">
        <div class="vis-side">
          <div class="vis-src">${[['فيسبوك', st.facebook], ['إنستغرام', st.instagram], ['جوجل', st.google], ['آيفون', st.ios], ['أندرويد', st.android], ['ارتداد (< 3ث)', st.bounce]]
            .map(([l, n]) => `<div><small>${l}</small><b>${pct(n)}</b></div>`).join('')}</div>
          <label class="vis-empty"><span>عرض كل الزيارات (حتى اللي ما أضافت إشي للسلة)</span><input type="checkbox" data-vempty ${V.empty ? 'checked' : ''}></label>
          <div class="vis-list">
            ${V.list.map(visitRow).join('') || '<div class="empty">ما في سلال هون</div>'}

          </div>
        </div>
        <div class="vis-detail ${V.sel ? 'is-on' : ''}">${visitDetail()}</div>
      </div>`;
  }

  function visitRow(v) {
    const [label, cls] = visitState(v);
    return `<button class="vis-row ${S.visits.sel === v.id ? 'is-sel' : ''}" data-visit="${esc(v.id)}">
      <div class="vis-row__top"><code>${esc(v.id.slice(0, 12))}</code><span class="badge ${cls}">${label}</span><span class="vis-chip-sm">${DEVICES[v.device] || v.device || ''}</span>
        <span class="muted small" style="margin-inline-start:auto">⏱️ ${span(v.created, v.updated)} · ${ago(v.updated)}</span></div>
      <div class="vis-row__mid"><b>${esc(v.name || 'زائر')}</b>${v.phone ? ` <span dir="ltr" class="muted small">${esc(v.phone)}</span>` : ''}
        <b class="vis-row__val">${v.cart_value ? `${+v.cart_value.toFixed(2)} د.أ` : ''}</b></div>
      <div class="muted small">${SOURCES[v.source] || esc(v.source || '')} · ${esc(v.landing || '/')}${v.order_name ? ` · طلب ${esc(v.order_name)}` : ''}${v.status === 'followed' ? ' · ✓ تمت المتابعة' : v.status === 'ignored' ? ' · تم التجاهل' : ''}</div>

  function visitDetail() {

    let items = [];
    try { items = JSON.parse(s.cart_json || '[]'); } catch {}
    const summary = [`سلة ${s.name || 'زائر'}${s.phone ? ' · ' + s.phone : ''}`, ...items.map(i => `• ${i.t}${i.v ? ' (' + i.v + ')' : ''} × ${i.q} — ${i.p} د.أ${(i.props || []).length ? '\n   ' + i.props.join('\n   ') : ''}`),
      `المجموع: ${+(+s.cart_value).toFixed(2)} د.أ`, [s.gov, s.area].filter(Boolean).join(' / ')].filter(Boolean).join('\n');

      </section>` : ''}
      <section class="vis-d__box">
        <b>حالة المتابعة والملاحظات</b>
        <div class="actions">${[['followed', '✓ تمت المتابعة'], ['ignored', 'تم التجاهل'], ['', 'إلغاء التحديد']].map(([k, l]) => `<button class="btn btn--sm ${s.status === k && k ? 'btn--primary' : ''}" data-vstatus="${k}">${l}</button>`).join('')}</div>
